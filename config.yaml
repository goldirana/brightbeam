# ═══════════════════════════════════════════════════════════════
# BrightBeam Configuration — SINGLE SOURCE OF TRUTH
# Change anything here, it propagates everywhere.
# ═══════════════════════════════════════════════════════════════

# ─── LLM Models ───────────────────────────────────────────────
models:
  summarisation:
    provider: "openrouter"          # openrouter | openai | anthropic
    model: "anthropic/claude-sonnet-4"
    temperature: 0.3
    max_tokens: 2000
  judge:
    provider: "openrouter"
    model: "anthropic/claude-sonnet-4"
    temperature: 0.1
    max_tokens: 1500

# ─── Embedding ────────────────────────────────────────────────
embedding:
  provider: "openai"                # openai | sentence_transformers
  model: "text-embedding-3-small"
  dimension: 1536

# ─── Pipeline Settings ────────────────────────────────────────
pipeline:
  max_retries: 2
  pass_threshold: 0.8
  max_summary_chars: 1500
  company_name: "COMPANY"

# ─── Paths (relative to project root) ────────────────────────
paths:
  data_dir: "data/raw/bb-hiring-call-summary"
  examples_dir: "data/raw/bb-hiring-call-summary/examples"
  test_dir: "data/raw/bb-hiring-call-summary/to-summarise"
  output_dir: "output"
  centroids_file: "output/centroids.json"
  prompts_dir: "prompts"

# ─── Prompt File Paths (relative to prompts_dir) ─────────────
prompts:
  system_base: "system/base.txt"
  output_format: "system/output_format.txt"
  retry: "system/retry.txt"
  judge_system: "judge/system.txt"
  judge_evaluate: "judge/evaluate.txt"
  # Category prompts are auto-loaded from prompts/category/{category_name}.txt

# ─── Categories ───────────────────────────────────────────────
categories:
  liability_claim:
    description: "Calls about liability disputes, fault determination"
    keywords:
      - "liability"
      - "fault"
      - "negligence"
      - "third party"
      - "at fault"
      - "not at fault"
      - "blame"
      - "responsible"
      - "admitted"
      - "split liability"
  injury:
    description: "Calls involving personal injury claims"
    keywords:
      - "injury"
      - "hospital"
      - "medical"
      - "treatment"
      - "pain"
      - "doctor"
      - "physiotherapy"
      - "whiplash"
      - "GP"
      - "ambulance"
  vehicle_damage:
    description: "Calls about vehicle damage, repairs, write-offs"
    keywords:
      - "vehicle"
      - "car"
      - "damage"
      - "repair"
      - "garage"
      - "write-off"
      - "MOT"
      - "bumper"
      - "windscreen"
      - "bodywork"
  property_damage:
    description: "Calls about property damage claims"
    keywords:
      - "property"
      - "house"
      - "flooding"
      - "roof"
      - "wall"
      - "fence"
      - "garden"
      - "building"
      - "pipe"
      - "leak"
  settlement_negotiation:
    description: "Calls involving settlement offers and negotiation"
    keywords:
      - "settlement"
      - "offer"
      - "negotiate"
      - "accept"
      - "reject"
      - "compensation"
      - "waiver"
      - "payment"
      - "final offer"
      - "counter"
  general_enquiry:
    description: "General policy enquiries, status updates, admin"
    keywords:
      - "policy"
      - "update"
      - "status"
      - "query"
      - "information"
      - "confirm"
      - "details"
      - "renewal"
      - "premium"
      - "cover"

# ─── Feature Extraction ──────────────────────────────────────
feature_extraction:
  top_keywords: 10
  tfidf_max_features: 5000
  tfidf_ngram_range: [1, 2]

